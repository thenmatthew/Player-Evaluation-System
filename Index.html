<!DOCTYPE html>
<html>

<head>

<base target="_top">

<style>

body {
  font-family: Arial, sans-serif;
  padding: 20px;
  max-width: 600px;
  margin: auto;
  background: #f7f9fc;
  color: #202124;
}

h1 {
  color: #1a73e8;
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  margin-bottom: 5px;
}

h3 {
  margin-top: 10px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  font-size: 16px;
  box-sizing: border-box;
  border: 1px solid #dadce0;
  border-radius: 6px;
  background: white;
}

textarea {
  height: 100px;
}

button {
  width: 100%;
  padding: 12px;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #1557b0;
}

.hidden {
  display: none;
}

.rating {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.rating button {
  width: 42px;
  height: 42px;
  padding: 0;
  background: #eeeeee;
  color: #333;
  border-radius: 50%;
}

.rating button.selected {
  background: #1a73e8;
  color: white;
}

.section {
  margin-top: 25px;
  border-top: 1px solid #ddd;
  padding-top: 15px;
}

.error {
  color: #d93025;
  background: #fce8e6;
  padding: 10px;
  border-radius: 6px;
}

.success {
  color: #188038;
  background: #e6f4ea;
  padding: 10px;
  border-radius: 6px;
}

/* ---------------------------------
   TEAM PROGRESS
--------------------------------- */

.progress-card {
  background: white;
  border: 1px solid #dadce0;
  border-radius: 10px;
  padding: 15px;
  margin: 20px 0;
}

.progress-title {
  font-size: 13px;
  color: #5f6368;
  margin-bottom: 5px;
}

.progress-text {
  font-size: 18px;
  font-weight: bold;
  color: #202124;
}

.progress-track {
  width: 100%;
  height: 9px;
  background: #e8eaed;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #34a853;
  border-radius: 10px;
  transition: width 0.3s ease;
}

/* ---------------------------------
   PLAYER STATUS
--------------------------------- */

.player-selection {
  position: relative;
}

.player-status {
  margin-top: -8px;
  margin-bottom: 15px;
  font-size: 14px;
  font-weight: bold;
}

.status-complete {
  color: #188038;
}

.status-missing {
  color: #d93025;
}

.status-icon {
  margin-right: 5px;
}

/* ---------------------------------
   RATING GUIDE
--------------------------------- */

.rating-guide {
  background: #f5f5f5;
  border: 1px solid #ddd;
  padding: 12px;
  margin-bottom: 20px;
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.5;
}

.summary-card{
    background:#fff;
    border:1px solid #dadce0;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.summary-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:12px;
}
.summary-player-name{
    font-size:19px;
    font-weight:700;
    color:#202124;
    line-height:1.2;
}

.summary-grade{
    display:inline-block;
    margin-top:6px;
    padding:3px 10px;
    border-radius:999px;
    background:#e8f0fe;
    color:#1a73e8;
    font-size:12px;
    font-weight:600;
}

.summary-rating{
    text-align:right;
    min-width:70px;
}

.summary-rating-value{
    font-size:28px;
    font-weight:700;
    color:#1a73e8;
    line-height:1;
}

.summary-rating-label{
    font-size:11px;
    color:#5f6368;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    border-bottom:1px solid #f1f3f4;
}

.summary-row:last-of-type{
    border-bottom:none;
}

.summary-row span{
    color:#5f6368;
}

.summary-row strong{
    color:#202124;
}

.summary-stars{

    color:#f9ab00;

    font-size:18px;

    letter-spacing:1px;

    line-height:1.1;

}
.summary-complete{color:#188038;}
.summary-pending{color:#d93025;}

/* ---------------------------------
   COACH SUMMARY HEADER
--------------------------------- */

.summary-header-card{

  background:white;

  border:1px solid #dadce0;

  border-radius:10px;

  padding:18px;

  margin-bottom:20px;

  box-shadow:0 1px 3px rgba(0,0,0,.08);

}

.summary-header-card h3{

  margin:0 0 12px 0;

  color:#1a73e8;

}

.summary-stats{

  font-size:15px;

  font-weight:bold;

  color:#202124;

  margin-bottom:12px;

}

.summary-progress-track{

  height:10px;

  background:#e8eaed;

  border-radius:10px;

  overflow:hidden;

}

.summary-progress-bar{

  height:100%;

  width:0%;

  background:#34a853;

  transition:width .3s ease;

}
/* ---------------------------------
   SAVE BUTTON
--------------------------------- */

.save-button {
  margin-top: 10px;
  margin-bottom: 20px;
}

</style>

</head>


<body>


<h1>
WAA In-House Player Evaluations
</h1>


<div id="loginSection">

  <p>
    Enter coach access code:
  </p>

  <input
    id="code"
    placeholder="Example: AMOS-4827"
  >

  <button onclick="login()">
    Continue
  </button>

</div>



<div id="appSection" class="hidden">


  <div id="welcome"></div>


  <!-- TEAM PROGRESS -->

  <div class="progress-card">

    <div class="progress-title">
      Team Evaluation Progress
    </div>

    <div
      id="progress"
      class="progress-text"
    >
      Loading...
    </div>

    <div class="progress-track">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>



  <div class="section">


    <h3>
      Select Player
    </h3>


    <div class="player-selection">

      <select id="player"></select>

    </div>


    <div
      id="playerStatus"
      class="player-status"
    ></div>



    <div class="section">


      <h3>
        Player Evaluation
      </h3>


      <div class="rating-guide">

        <strong>Rating Guide</strong><br>

        1 = Beginner<br>
        2 = Developing<br>
        3 = Average<br>
        4 = Above Average<br>
        5 = Advanced

      </div>


      <label>
        Fielding
      </label>

      <div
        class="rating"
        id="fielding"
      ></div>


      <label>
        Hitting
      </label>

      <div
        class="rating"
        id="hitting"
      ></div>


      <label>
        Throwing
      </label>

      <div
        class="rating"
        id="throwing"
      ></div>


      <label>
        Running
      </label>

      <div
        class="rating"
        id="running"
      ></div>


      <label>
        Game Concepts
      </label>

      <div
        class="rating"
        id="gameConcepts"
      ></div>


      <label>
        Attitude / Effort
      </label>

      <div
        class="rating"
        id="attitude"
      ></div>


      <label>
        Overall
      </label>

      <div
        class="rating"
        id="overall"
      ></div>



      <label>
        Primary Position
      </label>


      <select id="primaryPosition">

        <option value="">
          Select Position
        </option>

        <option value="Infield">
          Infield
        </option>

        <option value="Outfield">
          Outfield
        </option>

        <option value="Utility">
          Utility
        </option>

      </select>



      <label>
        Pitching Ability
      </label>

      <div
        class="rating"
        id="pitchingAbility"
      ></div>



      <label>
        Catching Ability
      </label>

      <div
        class="rating"
        id="catchingAbility"
      ></div>



      <label>
        Comments
      </label>


      <textarea
        id="comments"
      ></textarea>



      <button
        class="save-button"
        onclick="submitEvaluation()"
      >
        Save Evaluation
      </button>


    </div>

  </div>



 <div class="section">

  <div class="summary-header-card">

    <h3>⚾ My Team Summary</h3>

    <div id="summaryStats" class="summary-stats">
      Loading...
    </div>

    <div class="summary-progress-track">
      <div
        id="summaryProgressBar"
        class="summary-progress-bar">
      </div>
    </div>

  </div>

  <div id="coachSummary">

    <p>Loading team summary...</p>

  </div>

</div>

<div id="message"></div>


</div>



<script>


let currentCoach = null;


/* ---------------------------------
   LOGIN
--------------------------------- */

function login() {

  const code =
    document.getElementById("code")
      .value
      .trim()
      .toUpperCase();


  google.script.run

    .withSuccessHandler(loadCoach)

    .withFailureHandler(showError)

    .validateCoachCode(code);

}



/* ---------------------------------
   LOAD COACH
--------------------------------- */

function loadCoach(response) {

  if (!response.success) {

    showMessage(
      "Invalid access code.",
      true
    );

    return;

  }


  currentCoach = response;


  document
    .getElementById("loginSection")
    .classList
    .add("hidden");


  document
    .getElementById("appSection")
    .classList
    .remove("hidden");


  document
    .getElementById("welcome")
    .innerHTML =

    `

    <h2>
      Welcome ${escapeHtml(response.coachName)}
    </h2>

    <h3>
      ${escapeHtml(response.teamName)}
    </h3>

    `;


  const dropdown =
    document.getElementById("player");


  dropdown.innerHTML = "";


  response.players.forEach(function(player) {

    let option =
      document.createElement("option");


    option.value =
      player.playerId;


    const playerName =
      player.name ||
      (
        (player.firstName || "") +
        " " +
        (player.lastName || "")
      ).trim();


    option.text =
      (
        player.evaluated
          ? "✓ "
          : "○ "
      ) +
      playerName;


    option.dataset.name =
      playerName;


    option.dataset.evaluated =
      player.evaluated
        ? "true"
        : "false";


    dropdown.appendChild(option);

  });


  const totalPlayers =
    response.players.length;


  const evaluatedPlayers =
    response.players.filter(function(player) {

      return player.evaluated;

    }).length;


  updateProgress(
    evaluatedPlayers,
    totalPlayers
  );


  updatePlayerStatus();
  loadCoachSummary();


  dropdown.addEventListener(
    "change",
    updatePlayerStatus
  );


  [
    "fielding",
    "hitting",
    "throwing",
    "running",
    "gameConcepts",
    "attitude",
    "overall"

  ].forEach(createRatingButtons);


  createNARatingButtons(
    "pitchingAbility"
  );


  createNARatingButtons(
    "catchingAbility"
  );

}



/* ---------------------------------
   UPDATE TEAM PROGRESS
--------------------------------- */

function updateProgress(
  evaluated,
  total
) {

  const progress =
    document.getElementById("progress");


  const progressBar =
    document.getElementById("progressBar");


  progress.textContent =
    evaluated +
    " of " +
    total +
    " players evaluated";


  const percent =
    total === 0
      ? 0
      : (evaluated / total) * 100;


  progressBar.style.width =
    percent + "%";

}



/* ---------------------------------
   PLAYER STATUS
--------------------------------- */

function updatePlayerStatus() {

  const dropdown =
    document.getElementById("player");


  if (!dropdown.options.length) {

    return;

  }


  const selected =
    dropdown.options[
      dropdown.selectedIndex
    ];


  const status =
    document.getElementById(
      "playerStatus"
    );


  const evaluated =
    selected.dataset.evaluated === "true";


  if (evaluated) {

    status.className =
      "player-status status-complete";


    status.innerHTML =
      '<span class="status-icon">✓</span>' +
      'Evaluation Complete';

  } else {

    status.className =
      "player-status status-missing";


    status.innerHTML =
      '<span class="status-icon">○</span>' +
      'Evaluation Needed';

  }

}



/* ---------------------------------
   RATING BUTTONS
--------------------------------- */

function createRatingButtons(id) {

  const container =
    document.getElementById(id);


  container.innerHTML = "";


  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    createButton(
      container,
      i
    );

  }

}



/* ---------------------------------
   N/A RATING BUTTONS
--------------------------------- */

function createNARatingButtons(id) {

  const container =
    document.getElementById(id);


  container.innerHTML = "";


  createButton(
    container,
    "N/A"
  );


  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    createButton(
      container,
      i
    );

  }

}



/* ---------------------------------
   CREATE RATING BUTTON
--------------------------------- */

function createButton(
  container,
  value
) {

  let button =
    document.createElement("button");


  button.type =
    "button";


  button.innerHTML =
    value;


  button.onclick =
    function() {

      container
        .querySelectorAll("button")
        .forEach(function(btn) {

          btn.classList.remove(
            "selected"
          );

        });


      button.classList.add(
        "selected"
      );


      container.dataset.value =
        value;

    };


  container.appendChild(
    button
  );

}



/* ---------------------------------
   SUBMIT EVALUATION
--------------------------------- */

function submitEvaluation() {

  const player =
    document.getElementById("player");


  const selected =
    player.options[
      player.selectedIndex
    ];


  const evaluation = {

    coachName:
      currentCoach.coachName,


    teamId:
      currentCoach.teamId,


    teamName:
      currentCoach.teamName,


    playerId:
      selected.value,


    playerName:
      selected.dataset.name,


    fielding:
      document.getElementById("fielding")
        .dataset.value || "",


    hitting:
      document.getElementById("hitting")
        .dataset.value || "",


    throwing:
      document.getElementById("throwing")
        .dataset.value || "",


    running:
      document.getElementById("running")
        .dataset.value || "",


    gameConcepts:
      document.getElementById("gameConcepts")
        .dataset.value || "",


    attitude:
      document.getElementById("attitude")
        .dataset.value || "",


    overall:
      document.getElementById("overall")
        .dataset.value || "",


    primaryPosition:
      document.getElementById("primaryPosition")
        .value,


    pitchingAbility:
      document.getElementById("pitchingAbility")
        .dataset.value || "N/A",


    catchingAbility:
      document.getElementById("catchingAbility")
        .dataset.value || "N/A",


    comments:
      document.getElementById("comments")
        .value

  };


  google.script.run

    .withSuccessHandler(
      function(response) {

        showMessage(
          response.message
        );


        /*
         * Update the selected player
         * immediately after a successful save.
         */

        selected.dataset.evaluated =
          "true";


        selected.text =
          "✓ " +
          selected.dataset.name;


        updatePlayerStatus();


        const players =
          currentCoach.players;


        const evaluatedCount =
          players.filter(
            function(player) {

              return player.evaluated;

            }
          ).length + 1;


        loadCoachSummary();

        updateProgress(
          Math.min(
            evaluatedCount,
            players.length
          ),
          players.length
        );

      }
    )

    .withFailureHandler(showError)

    .saveEvaluation(evaluation);

}



/* ---------------------------------
   MESSAGES
--------------------------------- */

function showMessage(
  message,
  error = false
) {

  document.getElementById("message")
    .innerHTML =

    `

    <p class="${
      error
        ? "error"
        : "success"
    }">

      ${escapeHtml(message)}

    </p>

    `;

}



/* ---------------------------------
   ERROR
--------------------------------- */

function showError(error) {

  showMessage(
    error.message,
    true
  );

}



/* ---------------------------------
   HTML SAFETY
--------------------------------- */


function loadCoachSummary(){
 google.script.run.withSuccessHandler(renderCoachSummary).getCoachSummary(currentCoach.teamId);
}
function renderCoachSummary(data){
 const c=document.getElementById("coachSummary");
 const stats =
  document.getElementById("summaryStats");

const progress =
  document.getElementById("summaryProgressBar");

stats.textContent =
  data.totalPlayers +
  " Players   •   " +
  data.evaluatedPlayers +
  " Evaluated   •   " +
  data.percentComplete +
  "% Complete";

progress.style.width =
  data.percentComplete + "%";
 if(!data||!data.players){c.innerHTML="<p>No players found.</p>";return;}
c.innerHTML=data.players.map(p=>`

<div class="summary-card">

<div class="summary-header">

    <div>

        <div class="summary-player-name">
            ${p.evaluated ? "🟢" : "🟡"}
            ${escapeHtml(p.playerName)}
        </div>

        <div class="summary-grade">
            Grade ${escapeHtml(p.grade)}
        </div>

    </div>

<div class="summary-rating">

    <div class="summary-stars">

        ${createStars(p.overall)}

    </div>

    <div class="summary-rating-value">

        ${p.overall || "-"}/5

    </div>

    <div class="summary-rating-label">

        Overall

    </div>

</div>

</div>

<div>
<div class="summary-row">
    <span>Fielding</span>
    <strong>${escapeHtml(p.fielding||"-")}</strong>
</div>

<div class="summary-row">
    <span>Hitting</span>
    <strong>${escapeHtml(p.hitting||"-")}</strong>
</div>

<div class="summary-row">
    <span>Throwing</span>
    <strong>${escapeHtml(p.throwing||"-")}</strong>
</div>

<div class="summary-row">
    <span>Running</span>
    <strong>${escapeHtml(p.running||"-")}</strong>
</div>

<div class="summary-row">
    <span>Game Concepts</span>
    <strong>${escapeHtml(p.gameConcepts||"-")}</strong>
</div>

<div class="summary-row">
    <span>Attitude</span>
    <strong>${escapeHtml(p.attitude||"-")}</strong>
</div>

<div class="summary-row">
    <span>Primary Position</span>
    <strong>${escapeHtml(p.primaryPosition||"-")}</strong>
</div>

<div class="summary-row">
    <span>Pitching</span>
    <strong>${escapeHtml(p.pitchingAbility||"N/A")}</strong>
</div>

<div class="summary-row">
    <span>Catching</span>
    <strong>${escapeHtml(p.catchingAbility||"N/A")}</strong>
</div>

</div>

</div>

`).join("");
}
function createStars(value){

    const rating = Number(value);

    if(!rating){
        return "☆☆☆☆☆";
    }

    return "★★★★★".substring(0,rating) +
           "☆☆☆☆☆".substring(rating);

}

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
